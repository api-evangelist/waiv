aid: waiv
name: Waiv
description: 'Waiv is a Paris-based AI precision-testing company spun out of Owkin (formerly Owkin Dx)
  that builds clinically validated, AI-powered diagnostic tests for oncology and digital pathology. Its
  products — RlapsRisk BC (breast-cancer distant-relapse risk), the MSIntuit Suite (MSI/dMMR pre-screening
  in colorectal, gastric and endometrial cancer), BRCAura RUO (gBRCA pre-screening) and TLS Detect — read
  routine H&E whole-slide images to accelerate biomarker detection, outcome prediction and treatment-response
  assessment. The tests are delivered through Destra, an AI-native digital pathology platform that lab and
  clinician users reach in the browser and that laboratories can wire into an existing IMS/LIS through the
  Destra API. RlapsRisk BC and MSIntuit CRC hold dual CE-IVD marking under the EU IVDR. Waiv raised $33M
  led by OTB Ventures and Alpha Intelligence Capital, with Serena, Karista and SistaFund participating,
  and later closed $35M total with CRB Health Tech. The Destra API is advertised on the product page but
  is sales-gated — there is no public developer portal, reference, or machine-readable specification.'
